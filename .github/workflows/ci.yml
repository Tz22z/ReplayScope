name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[dev]'
      - run: ruff check src tests scripts
      - run: ruff format --check src tests scripts
      - run: pytest --cov=replayscope --cov-report=term-missing
      - run: python scripts/validate_claims.py
  integration:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[dev]'
      - run: docker compose up -d --build postgres migrate --wait
      - run: REPLAYSCOPE_INTEGRATION=1 pytest -q tests/integration
      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down -v
