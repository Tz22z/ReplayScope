services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: replayscope
      POSTGRES_PASSWORD: replayscope
      POSTGRES_DB: replayscope
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U replayscope"]
      interval: 2s
      timeout: 2s
      retries: 20
    ports: ["5433:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
  migrate:
    build: .
    command: ["migrate"]
    environment: &environment
      REPLAYSCOPE_DATABASE_URL: postgresql://replayscope:replayscope@postgres:5432/replayscope
      REPLAYSCOPE_STORAGE_ROOT: /data/cas
    depends_on:
      postgres: {condition: service_healthy}
    volumes: ["cas-data:/data/cas"]
  cli:
    build: .
    environment: *environment
    depends_on:
      migrate: {condition: service_completed_successfully}
    volumes: ["cas-data:/data/cas"]
    profiles: ["tools"]
volumes:
  postgres-data:
  cas-data:

