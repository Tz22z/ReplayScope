[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "replayscope"
version = "1.0.0"
description = "Replay and regression diagnosis for AI agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "psycopg[binary,pool]>=3.2,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[project.scripts]
replayscope = "replayscope.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: requires PostgreSQL"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.hatch.build.targets.wheel]
packages = ["src/replayscope"]

[tool.hatch.build.targets.wheel.force-include]
"src/replayscope/schema.sql" = "replayscope/schema.sql"
